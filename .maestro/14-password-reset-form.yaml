appId: host.exp.Exponent
---
# Password Reset Flow Test
# Tests the password reset screen with token parameter

- launchApp
- waitForAnimationToEnd

# Open the reset password screen directly with a token parameter
- openLink: "exp://192.168.0.104:8081/--/reset-password?token=test-token-12345"
- waitForAnimationToEnd:
    timeout: 5000

# If we see a Retry button (network error), tap it
- runFlow:
    when:
      visible: "Retry"
    commands:
      - tapOn: "Retry"
      - waitForAnimationToEnd

# Verify reset password screen
- assertVisible: "Reset Password"
- assertVisible: "Enter your new password below"
- assertVisible:
    id: "new-password-input"
- assertVisible:
    id: "confirm-password-input"

# Test 1: Try submitting without passwords
- tapOn:
    id: "reset-password-button"
- waitForAnimationToEnd
- assertVisible: "Please fill in all fields"
- tapOn: "OK"

# Test 2: Try submitting with password too short
- tapOn:
    id: "new-password-input"
- inputText: "12345"
- tapOn:
    id: "confirm-password-input"
- inputText: "12345"
- hideKeyboard
- tapOn:
    id: "reset-password-button"
- waitForAnimationToEnd
- assertVisible: "Password must be at least 6 characters long"
- tapOn: "OK"

# Test 3: Try submitting with mismatched passwords
- tapOn:
    id: "new-password-input"
- clearText
- inputText: "password123"
- tapOn:
    id: "confirm-password-input"
- clearText
- inputText: "password456"
- hideKeyboard
- tapOn:
    id: "reset-password-button"
- waitForAnimationToEnd
- assertVisible: "Passwords do not match"
- tapOn: "OK"

# Test 4: Submit with matching valid passwords
# Note: This will fail with invalid token error which is expected
- tapOn:
    id: "new-password-input"
- clearText
- inputText: "newPassword123"
- tapOn:
    id: "confirm-password-input"
- clearText
- inputText: "newPassword123"
- hideKeyboard
- tapOn:
    id: "reset-password-button"
- waitForAnimationToEnd:
    timeout: 3000

# Should show error about invalid token (since we used a fake token)
- assertVisible: "Error"
- runFlow:
    when:
      visible: "invalid"
    commands:
      - tapOn: "OK"

# Test 5: Test back to login button
- runFlow:
    when:
      visible:
        id: "back-to-login-button"
    commands:
      - tapOn:
          id: "back-to-login-button"
      - waitForAnimationToEnd
      - assertVisible: "KraftLog"
      - assertVisible: "Welcome back!"
