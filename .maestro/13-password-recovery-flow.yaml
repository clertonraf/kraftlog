appId: host.exp.Exponent
---
# Password Recovery Flow Test
# Tests the complete password recovery flow from request to reset

- launchApp
- waitForAnimationToEnd

# Open the KraftLog app via deep link
- openLink: exp://192.168.0.104:8081
- waitForAnimationToEnd:
    timeout: 5000

# If we see a Retry button (network error), tap it
- runFlow:
    when:
      visible: "Retry"
    commands:
      - tapOn: "Retry"
      - waitForAnimationToEnd

# Make sure we're on the login screen
- assertVisible: "KraftLog"
- assertVisible: "Welcome back!"

# Test 1: Navigate to Forgot Password screen
- tapOn: "Forgot Password?"
- waitForAnimationToEnd

# Verify forgot password screen
- assertVisible: "Forgot Password?"
- assertVisible: "Enter your email address and we'll send you a link to reset your password."
- assertVisible: 
    id: "email-input"

# Test 2: Try submitting without email
- tapOn:
    id: "submit-button"
- waitForAnimationToEnd
- assertVisible: "Please enter your email address"
- tapOn: "OK"

# Test 3: Try submitting with invalid email
- tapOn:
    id: "email-input"
- inputText: "invalid-email"
- tapOn:
    id: "submit-button"
- waitForAnimationToEnd
- assertVisible: "Please enter a valid email address"
- tapOn: "OK"

# Test 4: Submit valid email
- tapOn:
    id: "email-input"
- clearText
- inputText: "test@kraftlog.com"
- tapOn:
    id: "submit-button"
- waitForAnimationToEnd:
    timeout: 3000

# Should show success message (even if email doesn't exist for security)
- assertVisible: "Success"
- assertVisible: "If an account exists with this email"
- tapOn: "OK"
- waitForAnimationToEnd

# Should be back at login screen
- assertVisible: "KraftLog"
- assertVisible: "Welcome back!"

# Test 5: Test back button
- tapOn: "Forgot Password?"
- waitForAnimationToEnd
- assertVisible: "Forgot Password?"
- tapOn:
    id: "back-to-login-button"
- waitForAnimationToEnd
- assertVisible: "KraftLog"
- assertVisible: "Welcome back!"
